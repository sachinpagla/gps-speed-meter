<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GPS Speed Meter V2</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#070b10;
    color:#fff;
    min-height:100vh;
}

.app{
    width:100%;
    max-width:600px;
    margin:auto;
    padding:18px;
    text-align:center;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.title{
    font-size:24px;
    font-weight:700;
}

.version{
    font-size:12px;
    color:#00e59a;
    border:1px solid #00e59a;
    padding:5px 9px;
    border-radius:20px;
}

/* SPEEDOMETER */

.speedometer{
    width:min(82vw,360px);
    height:min(82vw,360px);
    margin:15px auto 25px;
    border-radius:50%;
    position:relative;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    border:14px solid #1d2734;

    box-shadow:
        0 0 0 5px #101720,
        0 0 45px rgba(0,229,154,.18);
}

.speed{
    font-size:clamp(65px,18vw,100px);
    line-height:1;
    font-weight:700;
    letter-spacing:-3px;
}

.unit{
    margin-top:8px;
    color:#9ba4ae;
    font-size:20px;
    font-weight:600;
}

/* SPEED SCALE */

.scale{
    position:absolute;
    inset:12px;
    border-radius:50%;
    pointer-events:none;
}

.tick{
    position:absolute;
    width:2px;
    height:10px;
    background:#657180;
    left:50%;
    top:0;
    transform-origin:50% 168px;
}

/* UNIT BUTTONS */

.units{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:18px;
}

.unitBtn{
    border:1px solid #26313e;
    background:#121923;
    color:#aaa;
    padding:9px 18px;
    border-radius:20px;
    font-size:14px;
}

.unitBtn.active{
    background:#00d990;
    color:#00150e;
    border-color:#00d990;
    font-weight:bold;
}

/* WARNING */

.warning{
    display:none;
    background:#5b2200;
    border:1px solid #ff6b00;
    color:#ffb27a;
    padding:10px;
    border-radius:10px;
    margin-bottom:15px;
}

/* CARDS */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.card{
    background:#121923;
    border:1px solid #1d2733;
    border-radius:14px;
    padding:16px 8px;
}

.label{
    color:#89939e;
    font-size:13px;
    margin-bottom:7px;
}

.value{
    font-size:22px;
    font-weight:bold;
}

/* BUTTONS */

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

button{
    cursor:pointer;
    border:none;
    font-weight:bold;
}

.mainBtn{
    padding:16px;
    border-radius:12px;
    background:#00d990;
    color:#00150e;
    font-size:17px;
}

.resetBtn{
    padding:16px;
    border-radius:12px;
    background:#18212c;
    color:#fff;
    font-size:17px;
    border:1px solid #293542;
}

.status{
    margin-top:15px;
    color:#8e99a5;
    font-size:14px;
}

/* RESPONSIVE */

@media(max-width:380px){

    .app{
        padding:12px;
    }

    .title{
        font-size:20px;
    }

    .speedometer{
        margin-top:8px;
    }

    .card{
        padding:13px 5px;
    }

    .value{
        font-size:19px;
    }
}

</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="title">🚗 GPS Speed Meter</div>
        <div class="version">V2 PRO</div>
    </div>

    <div class="speedometer">

        <div class="speed" id="speed">0</div>

        <div class="unit" id="speedUnit">
            KM/H
        </div>

    </div>

    <!-- UNIT -->

    <div class="units">

        <button class="unitBtn active"
                onclick="setUnit('kmh')"
                id="kmhBtn">
            KM/H
        </button>

        <button class="unitBtn"
                onclick="setUnit('mph')"
                id="mphBtn">
            MPH
        </button>

        <button class="unitBtn"
                onclick="setUnit('ms')"
                id="msBtn">
            M/S
        </button>

    </div>

    <!-- WARNING -->

    <div class="warning" id="warning">
        ⚠️ Speed limit warning
    </div>

    <!-- DATA -->

    <div class="grid">

        <div class="card">
            <div class="label">MAX SPEED</div>
            <div class="value" id="maxSpeed">0 km/h</div>
        </div>

        <div class="card">
            <div class="label">AVG SPEED</div>
            <div class="value" id="avgSpeed">0 km/h</div>
        </div>

        <div class="card">
            <div class="label">DISTANCE</div>
            <div class="value" id="distance">0.00 km</div>
        </div>

        <div class="card">
            <div class="label">TRIP TIME</div>
            <div class="value" id="tripTime">00:00:00</div>
        </div>

        <div class="card">
            <div class="label">GPS ACCURACY</div>
            <div class="value" id="accuracy">-- m</div>
        </div>

        <div class="card">
            <div class="label">GPS STATUS</div>
            <div class="value" id="gpsStatus">OFF</div>
        </div>

    </div>

    <!-- BUTTONS -->

    <div class="controls">

        <button class="mainBtn"
                id="startBtn"
                onclick="toggleGPS()">
            START GPS
        </button>

        <button class="resetBtn"
                onclick="resetTrip()">
            RESET
        </button>

    </div>

    <div class="status" id="status">
        GPS stopped
    </div>

</div>


<script>

let watchID = null;

let running = false;

let currentSpeedKmh = 0;

let maxSpeedKmh = 0;

let totalDistanceKm = 0;

let lastPosition = null;

let startTime = null;

let totalMovingSeconds = 0;

let lastTime = null;

let speedSamples = [];

let selectedUnit = "kmh";

const SPEED_LIMIT = 80;


/* -------------------------
   DISTANCE CALCULATION
------------------------- */

function calculateDistance(lat1, lon1, lat2, lon2){

    const R = 6371;

    const dLat =
        (lat2-lat1) * Math.PI / 180;

    const dLon =
        (lon2-lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2) +

        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *

        Math.sin(dLon/2) *
        Math.sin(dLon/2);

    const c =
        2 * Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

    return R*c;
}


/* -------------------------
   FORMAT TIME
------------------------- */

function formatTime(seconds){

    seconds = Math.floor(seconds);

    const h =
        Math.floor(seconds / 3600);

    const m =
        Math.floor((seconds % 3600) / 60);

    const s =
        seconds % 60;

    return (

        String(h).padStart(2,"0") +
        ":" +
        String(m).padStart(2,"0") +
        ":" +
        String(s).padStart(2,"0")

    );
}


/* -------------------------
   UNIT
------------------------- */

function setUnit(unit){

    selectedUnit = unit;

    document
        .querySelectorAll(".unitBtn")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    document
        .getElementById(unit + "Btn")
        .classList.add("active");

    updateSpeedDisplay();
}


/* -------------------------
   SPEED DISPLAY
------------------------- */

function updateSpeedDisplay(){

    let value = currentSpeedKmh;

    let unitText = "KM/H";

    if(selectedUnit === "mph"){

        value =
            currentSpeedKmh * 0.621371;

        unitText = "MPH";

    }

    if(selectedUnit === "ms"){

        value =
            currentSpeedKmh / 3.6;

        unitText = "M/S";

    }

    document.getElementById("speed")
        .innerText =
        value.toFixed(1);

    document.getElementById("speedUnit")
        .innerText =
        unitText;
}


/* -------------------------
   GPS
------------------------- */

function toggleGPS(){

    if(running){

        stopGPS();

    }else{

        startGPS();

    }
}


function startGPS(){

    if(!navigator.geolocation){

        document.getElementById("status")
            .innerText =
            "GPS not supported";

        return;
    }

    running = true;

    startTime = Date.now();

    lastTime = Date.now();

    document.getElementById("startBtn")
        .innerText =
        "STOP GPS";

    document.getElementById("gpsStatus")
        .innerText =
        "ON";

    document.getElementById("status")
        .innerText =
        "Getting GPS location...";

    watchID =
        navigator.geolocation.watchPosition(

            handlePosition,

            handleError,

            {
                enableHighAccuracy:true,
                maximumAge:1000,
                timeout:15000
            }

        );

    updateTimer();
}


/* -------------------------
   POSITION
------------------------- */

function handlePosition(position){

    const coords = position.coords;

    let speed =
        coords.speed;

    if(speed === null || isNaN(speed)){

        speed = 0;

    }else{

        speed =
            speed * 3.6;

    }

    currentSpeedKmh = speed;

    if(speed > maxSpeedKmh){

        maxSpeedKmh = speed;

    }

    if(speed > 1){

        speedSamples.push(speed);

    }

    /* DISTANCE */

    if(lastPosition){

        const distance =
            calculateDistance(

                lastPosition.latitude,
                lastPosition.longitude,

                coords.latitude,
                coords.longitude

            );

        /*
        Ignore unrealistic GPS jumps
        */

        if(distance < 0.2){

            totalDistanceKm += distance;

        }

    }

    lastPosition = {

        latitude:coords.latitude,

        longitude:coords.longitude

    };

    /* ACCURACY */

    document.getElementById("accuracy")
        .innerText =
        Math.round(coords.accuracy) + " m";

    document.getElementById("gpsStatus")
        .innerText =
        "ON";

    document.getElementById("status")
        .innerText =
        "GPS tracking active";

    updateSpeedDisplay();

    updateCards();

    /* WARNING */

    const warning =
        document.getElementById("warning");

    if(currentSpeedKmh >= SPEED_LIMIT){

        warning.style.display =
            "block";

    }else{

        warning.style.display =
            "none";

    }

}


/* -------------------------
   CARDS
------------------------- */

function updateCards(){

    document.getElementById("maxSpeed")
        .innerText =
        maxSpeedKmh.toFixed(1)
        + " km/h";

    let avg = 0;

    if(speedSamples.length){

        avg =
            speedSamples.reduce(
                (a,b)=>a+b,
                0
            ) / speedSamples.length;

    }

    document.getElementById("avgSpeed")
        .innerText =
        avg.toFixed(1)
        + " km/h";

    document.getElementById("distance")
        .innerText =
        totalDistanceKm.toFixed(2)
        + " km";

}


/* -------------------------
   TIMER
------------------------- */

function updateTimer(){

    if(!running) return;

    const now = Date.now();

    totalMovingSeconds =
        Math.floor(
            (now-startTime)/1000
        );

    document.getElementById("tripTime")
        .innerText =
        formatTime(totalMovingSeconds);

    setTimeout(updateTimer,1000);
}


/* -------------------------
   STOP
------------------------- */

function stopGPS(){

    if(watchID !== null){

        navigator.geolocation
            .clearWatch(watchID);

        watchID = null;

    }

    running = false;

    document.getElementById("startBtn")
        .innerText =
        "START GPS";

    document.getElementById("gpsStatus")
        .innerText =
        "OFF";

    document.getElementById("status")
        .innerText =
        "GPS stopped";

}


/* -------------------------
   RESET
------------------------- */

function resetTrip(){

    stopGPS();

    currentSpeedKmh = 0;

    maxSpeedKmh = 0;

    totalDistanceKm = 0;

    lastPosition = null;

    startTime = null;

    totalMovingSeconds = 0;

    speedSamples = [];

    document.getElementById("speed")
        .innerText =
        "0";

    document.getElementById("maxSpeed")
        .innerText =
        "0 km/h";

    document.getElementById("avgSpeed")
        .innerText =
        "0 km/h";

    document.getElementById("distance")
        .innerText =
        "0.00 km";

    document.getElementById("tripTime")
        .innerText =
        "00:00:00";

    document.getElementById("accuracy")
        .innerText =
        "-- m";

    document.getElementById("warning")
        .style.display =
        "none";

    updateSpeedDisplay();

}


/* -------------------------
   ERROR
------------------------- */

function handleError(error){

    let message =
        "GPS error";

    if(error.code === 1){

        message =
            "Location permission denied";

    }

    if(error.code === 2){

        message =
            "GPS position unavailable";

    }

    if(error.code === 3){

        message =
            "GPS timeout";

    }

    document.getElementById("status")
        .innerText =
        message;

}


/* INITIAL */

updateSpeedDisplay();

</script>

</body>
</html>
