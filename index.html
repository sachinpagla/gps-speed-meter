<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#070c12">

<title>GPS Speed Meter V3.1 PRO</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#070c12;
    --panel:#111a24;
    --panel2:#17222e;
    --text:#ffffff;
    --muted:#8d9aa8;
    --green:#00e894;
    --red:#ff4058;
    --yellow:#ffc400;
    --border:#263544;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

body.light{
    --bg:#edf2f6;
    --panel:#ffffff;
    --panel2:#e3eaf0;
    --text:#111111;
    --muted:#65717d;
    --border:#cbd5df;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.app{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:14px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.brand{
    font-size:22px;
    font-weight:800;
}

.version{
    color:var(--green);
    border:1px solid var(--green);
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
}

/* TOP BUTTONS */

.top-buttons{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:10px;
}

.icon-btn{
    width:52px;
    height:42px;
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:11px;
    font-size:19px;
}

/* GAUGE */

.gauge{
    width:min(94vw,430px);
    aspect-ratio:1/1;
    margin:5px auto 10px;
    position:relative;
}

.gauge-bg{
    position:absolute;
    inset:0;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            var(--bg) 0 56%,
            transparent 56%
        );

    border:13px solid #1b2836;

    box-shadow:
        0 0 0 4px #0d151e,
        0 0 45px rgba(0,232,148,.18);
}

/* SVG */

.gauge-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.arc-green{
    fill:none;
    stroke:#00e894;
    stroke-width:9;
    stroke-linecap:round;
}

.arc-yellow{
    fill:none;
    stroke:#ffc400;
    stroke-width:9;
    stroke-linecap:round;
}

.arc-red{
    fill:none;
    stroke:#ff4058;
    stroke-width:9;
    stroke-linecap:round;
}

/* TICKS */

.tick{
    stroke:#82909e;
    stroke-width:3;
    stroke-linecap:round;
}

.tick.major{
    stroke:#d0d8df;
    stroke-width:5;
}

/* NUMBERS */

.gauge-number{
    fill:#8996a4;
    font-size:13px;
    font-weight:bold;
    text-anchor:middle;
}

/* NEEDLE */

.needle{
    stroke:#ff4058;
    stroke-width:6;
    stroke-linecap:round;

    filter:
        drop-shadow(
            0 0 6px rgba(255,64,88,.9)
        );

    transition:
        transform .25s ease-out;
}

.needle-center{
    fill:#ff4058;
    stroke:#111a24;
    stroke-width:6;

    filter:
        drop-shadow(
            0 0 8px rgba(255,64,88,.8)
        );
}

/* DIGITAL */

.digital{
    position:absolute;
    left:0;
    right:0;
    top:43%;
    text-align:center;
    pointer-events:none;
}

.speed{
    font-size:clamp(60px,17vw,82px);
    line-height:1;
    font-weight:800;
    letter-spacing:-3px;
}

.speed-unit{
    margin-top:7px;
    color:var(--muted);
    font-size:18px;
    font-weight:bold;
}

.gauge-max{
    position:absolute;
    left:0;
    right:0;
    bottom:18%;
    text-align:center;
    color:var(--muted);
    font-size:12px;
}

/* UNIT BUTTONS */

.units{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-bottom:12px;
}

.unit-btn{
    padding:8px 16px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--muted);
}

.unit-btn.active{
    background:var(--green);
    color:#00150d;
    border-color:var(--green);
    font-weight:bold;
}

/* WARNING */

.warning{
    display:none;
    text-align:center;
    background:#45151d;
    color:#ff9ca7;
    border:1px solid var(--red);
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
    font-weight:bold;
}

/* CARDS */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 7px;
    text-align:center;
}

.label{
    color:var(--muted);
    font-size:11px;
    margin-bottom:6px;
}

.value{
    font-size:20px;
    font-weight:800;
}

/* CONTROLS */

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:10px;
}

.main-btn{
    padding:15px;
    border:0;
    border-radius:12px;
    background:var(--green);
    color:#00150d;
    font-size:16px;
    font-weight:800;
}

.reset-btn{
    padding:15px;
    border-radius:12px;
    background:var(--panel2);
    color:var(--text);
    border:1px solid var(--border);
    font-size:16px;
    font-weight:800;
}

/* EXTRA */

.extra{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:9px;
}

.extra-btn{
    padding:12px;
    border-radius:11px;
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--border);
    font-weight:bold;
}

.status{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin:12px 0 5px;
}

.footer{
    text-align:center;
    color:var(--muted);
    font-size:10px;
    padding:10px;
}

/* MOBILE */

@media(max-width:380px){

    .app{
        padding:10px;
    }

    .brand{
        font-size:19px;
    }

    .card{
        padding:12px 5px;
    }

    .value{
        font-size:18px;
    }

}

</style>
</head>


<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="brand">
            🚗 GPS Speed Meter
        </div>

        <div class="version">
            V3.1 PRO
        </div>

    </div>


    <!-- TOP BUTTONS -->

    <div class="top-buttons">

        <button
            class="icon-btn"
            onclick="toggleTheme()">
            🌙
        </button>

        <button
            class="icon-btn"
            onclick="toggleFullscreen()">
            ⛶
        </button>

        <button
            class="icon-btn"
            onclick="openMap()">
            📍
        </button>

    </div>


    <!-- GAUGE -->

    <div class="gauge">

        <div class="gauge-bg"></div>

        <svg
            class="gauge-svg"
            viewBox="0 0 400 400">

            <!-- GREEN ARC -->

            <path
                class="arc-green"
                d="M 74 300
                   A 155 155 0 0 1 112 82"/>

            <!-- YELLOW ARC -->

            <path
                class="arc-yellow"
                d="M 112 82
                   A 155 155 0 0 1 288 82"/>

            <!-- RED ARC -->

            <path
                class="arc-red"
                d="M 288 82
                   A 155 155 0 0 1 326 300"/>


            <!-- TICKS -->

            <g id="ticks"></g>


            <!-- NUMBERS -->

            <text
                class="gauge-number"
                x="72"
                y="322">
                0
            </text>

            <text
                class="gauge-number"
                x="110"
                y="83">
                40
            </text>

            <text
                class="gauge-number"
                x="200"
                y="57">
                80
            </text>

            <text
                class="gauge-number"
                x="290"
                y="83">
                120
            </text>

            <text
                class="gauge-number"
                x="328"
                y="322">
                160
            </text>


            <!-- NEEDLE -->

            <line
                id="needle"
                class="needle"
                x1="200"
                y1="200"
                x2="200"
                y2="65"
                transform="rotate(-130 200 200)">
            </line>


            <!-- CENTER -->

            <circle
                class="needle-center"
                cx="200"
                cy="200"
                r="12">
            </circle>

        </svg>


        <!-- DIGITAL -->

        <div class="digital">

            <div
                class="speed"
                id="speed">
                0.0
            </div>

            <div
                class="speed-unit"
                id="speedUnit">
                KM/H
            </div>

        </div>


        <div class="gauge-max">
            MAX 160 KM/H
        </div>

    </div>


    <!-- UNITS -->

    <div class="units">

        <button
            class="unit-btn active"
            id="kmhBtn"
            onclick="setUnit('kmh')">
            KM/H
        </button>

        <button
            class="unit-btn"
            id="mphBtn"
            onclick="setUnit('mph')">
            MPH
        </button>

        <button
            class="unit-btn"
            id="msBtn"
            onclick="setUnit('ms')">
            M/S
        </button>

    </div>


    <!-- WARNING -->

    <div
        class="warning"
        id="warning">

        ⚠️ SPEED LIMIT EXCEEDED

    </div>


    <!-- DATA -->

    <div class="grid">

        <div class="card">

            <div class="label">
                MAX SPEED
            </div>

            <div
                class="value"
                id="maxSpeed">
                0.0 km/h
            </div>

        </div>


        <div class="card">

            <div class="label">
                AVG SPEED
            </div>

            <div
                class="value"
                id="avgSpeed">
                0.0 km/h
            </div>

        </div>


        <div class="card">

            <div class="label">
                DISTANCE
            </div>

            <div
                class="value"
                id="distance">
                0.00 km
            </div>

        </div>


        <div class="card">

            <div class="label">
                TRIP TIME
            </div>

            <div
                class="value"
                id="tripTime">
                00:00:00
            </div>

        </div>


        <div class="card">

            <div class="label">
                GPS ACCURACY
            </div>

            <div
                class="value"
                id="accuracy">
                -- m
            </div>

        </div>


        <div class="card">

            <div class="label">
                HEADING
            </div>

            <div
                class="value"
                id="heading">
                --°
            </div>

        </div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            class="main-btn"
            id="startBtn"
            onclick="toggleGPS()">
            START GPS
        </button>

        <button
            class="reset-btn"
            onclick="resetTrip()">
            RESET
        </button>

    </div>


    <!-- EXTRA -->

    <div class="extra">

        <button
            class="extra-btn"
            onclick="setSpeedLimit()">
            ⚠️ Speed Limit
        </button>

        <button
            class="extra-btn"
            onclick="saveTrip()">
            💾 Save Trip
        </button>

    </div>


    <!-- STATUS -->

    <div
        class="status"
        id="status">
        GPS stopped
    </div>


    <div class="footer">
        GPS Speed Meter V3.1 PRO
    </div>

</div>


<script>

/* =========================================
   VARIABLES
========================================= */

let watchID = null;

let running = false;

let currentSpeed = 0;

let maxSpeed = 0;

let totalDistance = 0;

let lastGPS = null;

let lastGPSTime = null;

let samples = [];

let startTime = null;

let pausedTime = 0;

let selectedUnit = "kmh";

let speedLimit = 80;

let latitude = null;

let longitude = null;


/* =========================================
   CREATE GAUGE TICKS
========================================= */

const ticks =
    document.getElementById("ticks");


for(let i = 0; i <= 32; i++){

    const angle =
        -130 + (i / 32) * 260;

    const rad =
        angle * Math.PI / 180;

    const outerX =
        200 + Math.sin(rad) * 160;

    const outerY =
        200 - Math.cos(rad) * 160;

    const innerLength =
        i % 4 === 0 ? 16 : 9;

    const innerX =
        200 + Math.sin(rad) * (160-innerLength);

    const innerY =
        200 - Math.cos(rad) * (160-innerLength);

    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

    line.setAttribute(
        "x1",
        innerX
    );

    line.setAttribute(
        "y1",
        innerY
    );

    line.setAttribute(
        "x2",
        outerX
    );

    line.setAttribute(
        "y2",
        outerY
    );

    line.setAttribute(
        "class",
        i % 4 === 0
        ? "tick major"
        : "tick"
    );

    ticks.appendChild(line);

}


/* =========================================
   DISTANCE
========================================= */

function distanceBetween(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371;

    const dLat =
        (lat2-lat1)
        * Math.PI / 180;

    const dLon =
        (lon2-lon1)
        * Math.PI / 180;

    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2)

        +

        Math.cos(
            lat1*Math.PI/180
        )

        *

        Math.cos(
            lat2*Math.PI/180
        )

        *

        Math.sin(dLon/2) *
        Math.sin(dLon/2);

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

    return R*c;

}


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(seconds){

    seconds =
        Math.floor(seconds);

    const h =
        Math.floor(seconds / 3600);

    const m =
        Math.floor(
            (seconds % 3600) / 60
        );

    const s =
        seconds % 60;

    return (
        String(h).padStart(2,"0")
        + ":"
        +
        String(m).padStart(2,"0")
        + ":"
        +
        String(s).padStart(2,"0")
    );

}


/* =========================================
   UNIT
========================================= */

function setUnit(unit){

    selectedUnit = unit;

    document
        .querySelectorAll(".unit-btn")
        .forEach(function(button){

            button.classList.remove(
                "active"
            );

        });


    document
        .getElementById(
            unit + "Btn"
        )
        .classList.add("active");


    updateDisplay();

}


/* =========================================
   UPDATE SPEED DISPLAY
========================================= */

function updateDisplay(){

    let value =
        currentSpeed;

    let unit =
        "KM/H";


    if(selectedUnit === "mph"){

        value =
            currentSpeed *
            0.621371;

        unit =
            "MPH";

    }


    if(selectedUnit === "ms"){

        value =
            currentSpeed / 3.6;

        unit =
            "M/S";

    }


    document
        .getElementById("speed")
        .innerText =
        value.toFixed(1);


    document
        .getElementById("speedUnit")
        .innerText =
        unit;


    /* ==============================
       NEEDLE
    ============================== */

    const gaugeSpeed =
        Math.max(
            0,
            Math.min(
                currentSpeed,
                160
            )
        );


    const angle =
        -130 +
        (
            gaugeSpeed / 160
        ) * 260;


    document
        .getElementById("needle")
        .setAttribute(
            "transform",
            "rotate("
            +
            angle
            +
            " 200 200)"
        );


    /* ==============================
       WARNING
    ============================== */

    const warning =
        document.getElementById(
            "warning"
        );


    if(currentSpeed >= speedLimit){

        warning.style.display =
            "block";

    }else{

        warning.style.display =
            "none";

    }

}


/* =========================================
   START / STOP
========================================= */

function toggleGPS(){

    if(running){

        stopGPS();

    }else{

        startGPS();

    }

}


/* =========================================
   START GPS
========================================= */

function startGPS(){

    if(!navigator.geolocation){

        document
            .getElementById("status")
            .innerText =
            "GPS not supported";

        return;

    }


    running = true;

    startTime =
        startTime || Date.now();


    document
        .getElementById("startBtn")
        .innerText =
        "STOP GPS";


    document
        .getElementById("status")
        .innerText =
        "Getting GPS location...";


    watchID =
        navigator.geolocation.watchPosition(

            handlePosition,

            handleGPSError,

            {
                enableHighAccuracy:true,
                maximumAge:1000,
                timeout:15000
            }

        );


    updateTimer();

}


/* =========================================
   GPS POSITION
========================================= */

function handlePosition(position){

    const c =
        position.coords;

    const now =
        Date.now();


    latitude =
        c.latitude;

    longitude =
        c.longitude;


    let speed = null;


    /* ==============================
       NATIVE GPS SPEED
    ============================== */

    if(
        c.speed !== null &&
        c.speed !== undefined &&
        !isNaN(c.speed)
    ){

        speed =
            c.speed * 3.6;

    }


    /* ==============================
       FALLBACK SPEED
    ============================== */

    let calculatedSpeed = 0;


    if(
        lastGPS !== null &&
        lastGPSTime !== null
    ){

        const distance =
            distanceBetween(

                lastGPS.lat,
                lastGPS.lon,

                c.latitude,
                c.longitude

            );


        const seconds =
            (
                now -
                lastGPSTime
            ) / 1000;


        if(
            seconds > 0.5 &&
            seconds < 20 &&
            distance < 0.2
        ){

            calculatedSpeed =
                (
                    distance /
                    seconds
                ) * 3600;

        }

    }


    /* ==============================
       CHOOSE BEST SPEED
    ============================== */

    if(
        speed !== null &&
        speed > 0.5
    ){

        currentSpeed =
            speed;

    }else{

        currentSpeed =
            calculatedSpeed;

    }


    /* ==============================
       GPS NOISE FILTER
    ============================== */

    if(
        currentSpeed < 0.5
    ){

        currentSpeed = 0;

    }


    /* ==============================
       MAX SPEED
    ============================== */

    if(
        currentSpeed >
        maxSpeed
    ){

        maxSpeed =
            currentSpeed;

    }


    /* ==============================
       AVERAGE
    ============================== */

    if(
        currentSpeed > 1
    ){

        samples.push(
            currentSpeed
        );

    }


    /* ==============================
       DISTANCE
    ============================== */

    if(lastGPS !== null){

        const d =
            distanceBetween(

                lastGPS.lat,
                lastGPS.lon,

                c.latitude,
                c.longitude

            );


        /*
        Ignore bad GPS jumps.

        Only acc
